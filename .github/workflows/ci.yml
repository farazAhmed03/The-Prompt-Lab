name: Continuous Integration (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ============================================================================
  # JOB 1: Fast Lint & Unit Testing (Fails fast in < 30 seconds on code errors)
  # ============================================================================
  test-and-lint:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # --- Backend Checks ---
      - name: Install Backend Dependencies
        run: cd backend && npm ci

      - name: Run Backend ESLint (Syntax & Style Guard)
        run: cd backend && npm run lint

      - name: Run Backend Unit Tests (Security, Injection & Logic)
        run: cd backend && npm test

      # --- Frontend Checks ---
      - name: Install Frontend Dependencies
        run: cd frontend && npm ci

      - name: Build Frontend (Vite Production Compilation Check)
        run: cd frontend && npm run build

  # ============================================================================
  # JOB 2: DevSecOps SAST - SonarQube Cloud Code & Security Analysis
  # ============================================================================
  sonarcloud:
    name: SonarQube Cloud SAST Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code (Full Git History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ============================================================================
  # JOB 3: Docker Multi-Stage Build & Configuration Validation
  # ============================================================================
  docker-validation:
    name: Docker Build & Compose Check
    needs: test-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Mock Environment from Example
        run: cp .env.example .env

      - name: Validate Docker Compose Syntax
        run: docker compose config

      - name: Build Production Docker Images (Multi-Stage Builds)
        run: docker compose build

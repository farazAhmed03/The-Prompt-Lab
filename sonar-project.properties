sonar.projectKey=farazAhmed03_The-Prompt-Lab
sonar.organization=farazahmed03

# Project Metadata
sonar.projectName=The-Prompt-Lab
sonar.projectVersion=1.0.0

# Source Paths
sonar.sources=backend,frontend/src

# Coverage Settings (Exclude UI components and static configurations from coverage gate)

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.spec.js,**/*.test.js,docs/**,terraform/**,scripts/**

# Source Encoding
sonar.sourceEncoding=UTF-8

# ==============================================================================
# Nginx Configuration for PromptVerse (Reverse Proxy & Static Asset Server)
# Runs inside unprivileged Nginx container (ports 8080 and 8443)
# ==============================================================================

# 1. HTTP Server (Port 8080) - Redirects web traffic to secure HTTPS
server {
    listen 8080 default_server;
    server_name devops-project-demo.study www.devops-project-demo.study;

    location = /api/status {
        proxy_pass http://backend:5000/api/status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Redirect all public web traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server (Port 8443) - Secure Production SSL Server
server {
    listen 8443 ssl default_server;
    server_name devops-project-demo.study www.devops-project-demo.study;

    # SSL Certificates (Mounted from EC2 host /etc/letsencrypt)
    ssl_certificate /etc/letsencrypt/live/devops-project-demo.study/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devops-project-demo.study/privkey.pem;

    # TLS Protocols & Cipher Suites
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Frontend React Static Assets
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Backend API Reverse Proxy
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

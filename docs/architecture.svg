<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 850" width="100%" height="100%">
  <defs>
    <!-- Dark Grid Pattern matching Draw.io canvas -->
    <pattern id="drawioGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#222734" stroke-width="0.8" />
    </pattern>

    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <style>
    .label-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #f8fafc; }
    .label-top { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #e2e8f0; text-anchor: middle; }
    .label-sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 9px; fill: #94a3b8; text-anchor: middle; }
    .box-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }
    .conn-line { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .dashed-cyan { stroke: #38bdf8; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
    .dashed-green { stroke: #10b981; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
    .dashed-orange { stroke: #f59e0b; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
  </style>

  <!-- Canvas Background -->
  <rect width="1600" height="850" fill="#11151f" />
  <rect width="1600" height="850" fill="url(#drawioGrid)" />

  <!-- Diagram Header Title -->
  <text x="50" y="45" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#38bdf8">⚡ PromptVerse — Auto-Scaled, Highly Available AWS Cloud Architecture</text>
  <text x="50" y="70" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">Production Dual-AZ Hybrid Fleet: On-Demand Main Server + Dynamic Auto-Scaled Spot Workers (100% Terraform IaC)</text>

  <!-- ========================================================================= -->
  <!-- 1. USER & INGESTION LAYER                                                 -->
  <!-- ========================================================================= -->

  <!-- User / Client -->
  <g transform="translate(60, 260)">
    <circle cx="25" cy="15" r="10" fill="none" stroke="#e2e8f0" stroke-width="2" />
    <line x1="25" y1="25" x2="25" y2="55" stroke="#e2e8f0" stroke-width="2" />
    <line x1="10" y1="35" x2="40" y2="35" stroke="#e2e8f0" stroke-width="2" />
    <line x1="25" y1="55" x2="12" y2="80" stroke="#e2e8f0" stroke-width="2" />
    <line x1="25" y1="55" x2="38" y2="80" stroke="#e2e8f0" stroke-width="2" />
    <text x="25" y="-5" class="label-top">Public Users</text>
    <text x="25" y="98" class="label-sub">Client Browsers</text>
  </g>

  <!-- Route 53 DNS -->
  <g transform="translate(180, 265)">
    <rect width="100" height="70" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8" />
    <circle cx="50" cy="28" r="14" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5" />
    <text x="50" y="32" fill="#f59e0b" font-family="sans-serif" font-size="9" font-weight="900" text-anchor="middle">DNS</text>
    <text x="50" y="55" class="label-top" font-size="10">Route 53</text>
    <text x="50" y="85" class="label-sub">Alias A-Records</text>
  </g>

  <!-- Application Load Balancer (ALB) Box -->
  <g transform="translate(340, 220)">
    <rect width="210" height="160" rx="8" fill="#141a29" stroke="#38bdf8" stroke-width="2" />
    <!-- Header -->
    <rect x="0" y="0" width="210" height="26" rx="4" fill="#0284c7" />
    <text x="105" y="17" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">AWS ALB (devops-project-alb)</text>

    <!-- ACM Certificate Badge -->
    <rect x="15" y="38" width="180" height="32" rx="4" fill="#065f46" stroke="#10b981" stroke-width="1.2" />
    <text x="105" y="58" fill="#a7f3d0" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">🔒 ACM SSL (*.devops-project-demo.study)</text>

    <!-- Listeners -->
    <rect x="15" y="80" width="180" height="30" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1" />
    <text x="105" y="99" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">HTTPS :443 ➔ Target Group</text>

    <rect x="15" y="118" width="180" height="26" rx="4" fill="#0f172a" stroke="#eab308" stroke-dasharray="3 2" stroke-width="1" />
    <text x="105" y="135" fill="#fde047" font-family="sans-serif" font-size="9" font-weight="600" text-anchor="middle">HTTP :80 ➔ 301 Redirect to :443</text>
  </g>

  <!-- Target Group -->
  <g transform="translate(600, 260)">
    <rect width="130" height="80" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.8" />
    <circle cx="65" cy="30" r="14" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5" />
    <text x="65" y="34" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="900" text-anchor="middle">🎯</text>
    <text x="65" y="56" class="label-top" font-size="10">Target Group</text>
    <text x="65" y="70" class="label-sub" fill="#6ee7b7">HTTPS:443 /api/status</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 2. HYBRID COMPUTE CLUSTER (VPC)                                           -->
  <!-- ========================================================================= -->

  <!-- VPC Outer Box -->
  <g transform="translate(780, 100)">
    <rect width="770" height="690" rx="6" fill="#0b0f19" stroke="#8b5cf6" stroke-width="2" />
    <!-- VPC Badge -->
    <rect x="0" y="0" width="140" height="26" rx="4" fill="#8b5cf6" />
    <text x="70" y="18" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">AWS Default VPC</text>

    <!-- ----------------------------------------------------------------------- -->
    <!-- NODE A: On-Demand Main Server (Protected, 24/7)                         -->
    <!-- ----------------------------------------------------------------------- -->
    <g transform="translate(30, 45)">
      <rect width="710" height="260" rx="6" fill="#141a29" stroke="#f59e0b" stroke-width="2" />
      <rect x="0" y="0" width="360" height="24" rx="4" fill="#d97706" />
      <text x="180" y="16" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">🖥️ On-Demand Main Server (44.223.85.57)</text>
      <!-- Protection Shield -->
      <rect x="375" y="3" width="180" height="18" rx="3" fill="#065f46" stroke="#10b981" stroke-width="1" />
      <text x="465" y="15" fill="#a7f3d0" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">🛡️ Termination Protection: ON</text>
      <text x="630" y="16" fill="#94a3b8" font-family="sans-serif" font-size="9">AZ: us-east-1a</text>

      <!-- Docker Network inside Main Server -->
      <g transform="translate(20, 40)">
        <rect width="670" height="200" rx="4" fill="#0f172a" stroke="#0284c7" stroke-dasharray="4 2" stroke-width="1.2" />
        <text x="15" y="20" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="700">Docker Network (mern-network)</text>

        <!-- Nginx -->
        <rect x="25" y="40" width="120" height="70" rx="6" fill="#0e7490" stroke="#22d3ee" stroke-width="1.5" />
        <text x="85" y="70" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">Nginx SSL</text>
        <text x="85" y="90" fill="#cffafe" font-family="sans-serif" font-size="9" text-anchor="middle">Port 8080/8443</text>

        <!-- React -->
        <rect x="180" y="40" width="130" height="70" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
        <text x="245" y="70" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">React 18 Frontend</text>
        <text x="245" y="90" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Vite SPA</text>

        <!-- Node.js API -->
        <rect x="345" y="40" width="130" height="70" rx="6" fill="#15803d" stroke="#4ade80" stroke-width="1.5" />
        <text x="410" y="70" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">Node.js API</text>
        <text x="410" y="90" fill="#bbf7d0" font-family="sans-serif" font-size="9" text-anchor="middle">Express Port 5000</text>

        <!-- MongoDB -->
        <rect x="510" y="40" width="130" height="70" rx="6" fill="#14532d" stroke="#22c55e" stroke-width="1.5" />
        <text x="575" y="70" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">MongoDB 7.0</text>
        <text x="575" y="90" fill="#86efac" font-family="sans-serif" font-size="9" text-anchor="middle">mongo-data Volume</text>

        <!-- Observability bar -->
        <rect x="25" y="130" width="615" height="50" rx="4" fill="#1e1e2e" stroke="#f43f5e" stroke-width="1" />
        <text x="40" y="158" fill="#fda4af" font-family="sans-serif" font-size="10" font-weight="700">📊 Observability Stack:</text>
        <text x="180" y="158" fill="#ffffff" font-family="sans-serif" font-size="10">Prometheus Server (:9090)</text>
        <text x="370" y="158" fill="#ffffff" font-family="sans-serif" font-size="10">Grafana Dashboard (:3000)</text>
        <text x="540" y="158" fill="#38bdf8" font-family="sans-serif" font-size="9">1-Min Detailed Metrics</text>
      </g>
    </g>

    <!-- ----------------------------------------------------------------------- -->
    <!-- NODE B: Auto Scaling Spot Worker Layer                                  -->
    <!-- ----------------------------------------------------------------------- -->
    <g transform="translate(30, 325)">
      <rect width="710" height="190" rx="6" fill="#131d2e" stroke="#0ea5e9" stroke-width="1.8" stroke-dasharray="6 3" />
      <rect x="0" y="0" width="340" height="24" rx="4" fill="#0284c7" />
      <text x="170" y="16" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">⚡ Auto-Scaled Spot Instance Worker</text>
      <text x="360" y="16" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="700">Lifecycle: Spot (70% Cheaper) • Desired: 0 at Rest ($0.00)</text>

      <g transform="translate(20, 40)">
        <rect width="670" height="130" rx="4" fill="#0f172a" stroke="#0ea5e9" stroke-dasharray="4 2" stroke-width="1" />
        <text x="15" y="20" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="700">Cloned Golden AMI (ami-031e70f1ea741dc87) • Microservices Replica</text>

        <rect x="25" y="40" width="180" height="65" rx="6" fill="#0e7490" stroke="#22d3ee" stroke-width="1" />
        <text x="115" y="70" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Nginx + React Frontend</text>
        <text x="115" y="88" fill="#cffafe" font-family="sans-serif" font-size="9" text-anchor="middle">HTTPS Port 443</text>

        <rect x="245" y="40" width="180" height="65" rx="6" fill="#15803d" stroke="#4ade80" stroke-width="1" />
        <text x="335" y="70" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Node.js Express API</text>
        <text x="335" y="88" fill="#bbf7d0" font-family="sans-serif" font-size="9" text-anchor="middle">REST Engine (Port 5000)</text>

        <rect x="465" y="40" width="180" height="65" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1" />
        <text x="555" y="70" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Local In-Memory Cache</text>
        <text x="555" y="88" fill="#a7f3d0" font-family="sans-serif" font-size="9" text-anchor="middle">MongoDB Replica</text>
      </g>
    </g>

    <!-- ----------------------------------------------------------------------- -->
    <!-- AUTO SCALING & CLOUDWATCH AUTOMATION CONTROLLER                         -->
    <!-- ----------------------------------------------------------------------- -->
    <g transform="translate(30, 535)">
      <rect width="710" height="135" rx="6" fill="#1e1e2e" stroke="#ec4899" stroke-width="1.5" />
      <text x="20" y="24" fill="#f43f5e" font-family="sans-serif" font-size="11" font-weight="800">🔄 Auto Scaling Group & CloudWatch Reactive Controller (devops-project-asg)</text>

      <!-- CloudWatch High CPU -->
      <rect x="20" y="40" width="200" height="75" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="1.2" />
      <text x="120" y="62" fill="#fca5a5" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">🚨 High CPU Alarm (>80%)</text>
      <text x="120" y="82" fill="#ffffff" font-family="sans-serif" font-size="9" text-anchor="middle">Scale-Out Policy (+1)</text>
      <text x="120" y="98" fill="#f87171" font-family="sans-serif" font-size="8" text-anchor="middle">Launches Spot Instance</text>

      <!-- CloudWatch Low CPU -->
      <rect x="240" y="40" width="200" height="75" rx="4" fill="#042f2e" stroke="#10b981" stroke-width="1.2" />
      <text x="340" y="62" fill="#6ee7b7" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">📉 Low CPU Alarm (&lt;=30%)</text>
      <text x="340" y="82" fill="#ffffff" font-family="sans-serif" font-size="9" text-anchor="middle">Scale-In Policy (-1)</text>
      <text x="340" y="98" fill="#34d399" font-family="sans-serif" font-size="8" text-anchor="middle">Connection Draining & Termination</text>

      <!-- Launch Template -->
      <rect x="460" y="40" width="230" height="75" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <text x="575" y="62" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">📋 Launch Template v3</text>
      <text x="575" y="80" fill="#ffffff" font-family="sans-serif" font-size="9" text-anchor="middle">devops-project-lt (t3.micro)</text>
      <text x="575" y="96" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">Market: Spot • Golden AMI</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- CONNECTING ARROWS & TRAFFIC FLOWS                                         -->
  <!-- ========================================================================= -->

  <!-- User to Route 53 -->
  <line x1="100" y1="300" x2="175" y2="300" class="conn-line" marker-end="url(#arrow)" />

  <!-- Route 53 to ALB -->
  <line x1="280" y1="300" x2="335" y2="300" class="conn-line" marker-end="url(#arrowCyan)" />

  <!-- ALB to Target Group -->
  <line x1="550" y1="300" x2="595" y2="300" class="conn-line" stroke="#10b981" marker-end="url(#arrowGreen)" />

  <!-- Target Group to Main Server -->
  <path d="M 730 280 L 760 280 L 760 220 L 805 220" class="conn-line" stroke="#f59e0b" marker-end="url(#arrowOrange)" />

  <!-- Target Group to Spot Worker -->
  <path d="M 730 320 L 760 320 L 760 440 L 805 440" class="dashed-cyan" marker-end="url(#arrowCyan)" />

  <!-- CloudWatch Monitoring from Main Server to Controller -->
  <path d="M 1250 345 L 1250 560 L 745 560" class="dashed-orange" marker-end="url(#arrowOrange)" />

  <!-- Scale Out Trigger from Controller to Spot Instance -->
  <path d="M 810 635 L 750 635 L 750 480 L 805 480" class="dashed-cyan" marker-end="url(#arrowCyan)" />

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 750" width="100%" height="100%">
  <defs>
    <!-- Dark Grid Pattern matching Draw.io canvas -->
    <pattern id="drawioGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#222734" stroke-width="0.8" />
    </pattern>

    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrowSsh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <style>
    .label-top { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #e2e8f0; text-anchor: middle; }
    .label-sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 9px; fill: #94a3b8; text-anchor: middle; }
    .box-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }
    .conn-line { stroke: #94a3b8; stroke-width: 1.2; fill: none; }
    .dashed-line { stroke: #38bdf8; stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
  </style>

  <!-- Canvas Background -->
  <rect width="1500" height="750" fill="#11151f" />
  <rect width="1500" height="750" fill="url(#drawioGrid)" />

  <!-- ========================================================================= -->
  <!-- CONTAINERS / BOUNDARIES (VPC, EC2, DOCKER)                                -->
  <!-- ========================================================================= -->

  <!-- 1. AWS VPC Boundary (Purple Outline) -->
  <g transform="translate(380, 80)">
    <rect width="1070" height="460" rx="4" fill="none" stroke="#8b5cf6" stroke-width="1.5" />
    <!-- VPC Header Badge -->
    <rect x="0" y="0" width="70" height="22" rx="2" fill="#8b5cf6" />
    <text x="35" y="15" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">VPC</text>
  </g>

  <!-- 2. AWS EC2 Instance Boundary (Orange Outline) -->
  <g transform="translate(560, 115)">
    <rect width="860" height="395" rx="4" fill="#141a29" fill-opacity="0.4" stroke="#f59e0b" stroke-width="1.5" />
    <!-- EC2 Header Badge -->
    <rect x="0" y="0" width="240" height="22" rx="2" fill="#f59e0b" />
    <text x="120" y="15" fill="#000000" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">EC2: devops-project (3.239.236.53)</text>
  </g>

  <!-- 3. Docker Compose Network: mern-network (Blue Outline) -->
  <g transform="translate(710, 155)">
    <rect width="680" height="330" rx="4" fill="#0f172a" fill-opacity="0.6" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="5 3" />
    <!-- Docker Header Badge -->
    <rect x="0" y="0" width="210" height="20" rx="2" fill="#0284c7" />
    <text x="105" y="14" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">Docker Network: mern-network</text>
  </g>

  <!-- ========================================================================= -->
  <!-- MAIN HORIZONTAL ARCHITECTURE FLOW (LEFT TO RIGHT)                         -->
  <!-- ========================================================================= -->

  <!-- 1. USER / ACTOR (x: 60, y: 310) -->
  <g transform="translate(60, 310)">
    <!-- Stick Figure -->
    <circle cx="20" cy="10" r="8" fill="none" stroke="#e2e8f0" stroke-width="1.8" />
    <line x1="20" y1="18" x2="20" y2="40" stroke="#e2e8f0" stroke-width="1.8" />
    <line x1="8" y1="26" x2="32" y2="26" stroke="#e2e8f0" stroke-width="1.8" />
    <line x1="20" y1="40" x2="10" y2="60" stroke="#e2e8f0" stroke-width="1.8" />
    <line x1="20" y1="40" x2="30" y2="60" stroke="#e2e8f0" stroke-width="1.8" />
    
    <text x="20" y="-8" class="label-top">User</text>
    <text x="20" y="74" class="label-sub">Client Browser</text>
  </g>

  <!-- 2. ROUTE 53 DNS (x: 180, y: 315) -->
  <g transform="translate(180, 315)">
    <circle cx="24" cy="24" r="24" fill="#d97706" />
    <!-- DNS Icon details -->
    <circle cx="24" cy="24" r="18" fill="none" stroke="#ffffff" stroke-width="1.5" />
    <ellipse cx="24" cy="24" rx="8" ry="18" fill="none" stroke="#ffffff" stroke-width="1.2" />
    <line x1="6" y1="24" x2="42" y2="24" stroke="#ffffff" stroke-width="1.2" />
    <text x="24" y="27" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="900" text-anchor="middle">DNS</text>

    <text x="24" y="-12" class="label-top">Route 53</text>
    <text x="24" y="60" class="label-sub">devops-project-demo.study</text>
  </g>

  <!-- 3. SECURITY GROUP (x: 300, y: 315) -->
  <g transform="translate(300, 315)">
    <!-- Shield / SG Icon -->
    <path d="M 24 4 L 44 12 L 44 28 C 44 38 24 46 24 46 C 24 46 4 38 4 28 L 4 12 Z" fill="#b45309" stroke="#f59e0b" stroke-width="1.5" />
    <path d="M 16 25 L 22 31 L 32 19" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

    <text x="24" y="-12" class="label-top">Security Group</text>
    <text x="24" y="60" class="label-sub">Ports: 80, 443, 22</text>
  </g>

  <!-- 4. INTERNET GATEWAY (IGW) (x: 430, y: 315) -->
  <g transform="translate(430, 315)">
    <circle cx="24" cy="24" r="24" fill="#7c3aed" />
    <path d="M 12 36 L 12 18 C 12 12 36 12 36 18 L 36 36" fill="none" stroke="#ffffff" stroke-width="3" />
    <line x1="8" y1="36" x2="40" y2="36" stroke="#ffffff" stroke-width="2" />

    <text x="24" y="-12" class="label-top">IGW</text>
    <text x="24" y="60" class="label-sub">Internet Gateway</text>
  </g>

  <!-- 5. CERTBOT SSL / HTTPS TERMINATION (x: 590, y: 315) -->
  <g transform="translate(590, 315)">
    <rect x="2" y="2" width="44" height="44" rx="8" fill="#065f46" stroke="#10b981" stroke-width="1.5" />
    <!-- Lock Icon -->
    <rect x="14" y="22" width="20" height="15" rx="2" fill="#ffffff" />
    <path d="M 18 22 L 18 16 C 18 12 30 12 30 16 L 30 22" fill="none" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="24" cy="29" r="2" fill="#065f46" />

    <text x="24" y="-12" class="label-top">Certbot SSL</text>
    <text x="24" y="60" class="label-sub">HTTPS :443 (Let's Encrypt)</text>
  </g>

  <!-- 6. MERN-FRONTEND (REACT + NGINX) (x: 750, y: 315) -->
  <g transform="translate(750, 315)">
    <!-- Hexagon Shape matching user's diagram -->
    <path d="M 24 2 L 46 14 L 46 38 L 24 50 L 2 38 L 2 14 Z" fill="#0e7490" stroke="#22d3ee" stroke-width="1.5" />
    <text x="24" y="30" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">NGX</text>

    <text x="24" y="-12" class="label-top">Frontend</text>
    <text x="24" y="62" class="label-sub">Nginx + React (8080/8443)</text>
  </g>

  <!-- 7. MERN-BACKEND (NODE.JS REST API) (x: 930, y: 315) -->
  <g transform="translate(930, 315)">
    <!-- Hexagon Shape matching user's diagram -->
    <path d="M 24 2 L 46 14 L 46 38 L 24 50 L 2 38 L 2 14 Z" fill="#15803d" stroke="#4ade80" stroke-width="1.5" />
    <text x="24" y="30" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">API</text>

    <text x="24" y="-12" class="label-top">Backend</text>
    <text x="24" y="62" class="label-sub">Node.js Express (5000)</text>
  </g>

  <!-- 8. MERN-MONGODB (DATABASE) (x: 1120, y: 220) -->
  <g transform="translate(1120, 220)">
    <!-- Cylinder Database Shape -->
    <path d="M 4 12 C 4 6 44 6 44 12 L 44 36 C 44 42 4 42 4 36 Z" fill="#166534" stroke="#22c55e" stroke-width="1.5" />
    <ellipse cx="24" cy="12" rx="20" ry="6" fill="#22c55e" />
    <ellipse cx="24" cy="24" rx="20" ry="5" fill="none" stroke="#22c55e" stroke-width="1" />

    <text x="24" y="-12" class="label-top">MongoDB</text>
    <text x="24" y="55" class="label-sub">Port 27017 (Volume: mongo-data)</text>
  </g>

  <!-- 9. MONGO-EXPRESS (ADMIN GUI) (x: 1120, y: 400) -->
  <g transform="translate(1120, 400)">
    <rect x="2" y="2" width="44" height="44" rx="8" fill="#581c87" stroke="#c084fc" stroke-width="1.5" />
    <path d="M 12 16 L 36 16 M 12 24 L 36 24 M 12 32 L 26 32" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

    <text x="24" y="-12" class="label-top">Mongo-Express</text>
    <text x="24" y="60" class="label-sub">Admin GUI (Port 8081)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- HORIZONTAL CONNECTING ARROWS                                              -->
  <!-- ========================================================================= -->
  <!-- User to Route53 -->
  <line x1="100" y1="339" x2="175" y2="339" class="conn-line" marker-end="url(#arrow)" />
  
  <!-- Route53 to Security Group -->
  <line x1="228" y1="339" x2="295" y2="339" class="conn-line" marker-end="url(#arrow)" />

  <!-- Security Group to IGW -->
  <line x1="348" y1="339" x2="425" y2="339" class="conn-line" marker-end="url(#arrow)" />

  <!-- IGW to Certbot SSL -->
  <line x1="478" y1="339" x2="585" y2="339" class="conn-line" marker-end="url(#arrow)" />

  <!-- Certbot SSL to Frontend -->
  <line x1="638" y1="339" x2="745" y2="339" class="conn-line" marker-end="url(#arrow)" />

  <!-- Frontend to Backend -->
  <line x1="798" y1="339" x2="925" y2="339" class="conn-line" marker-end="url(#arrow)" />

  <!-- Backend to MongoDB (Branch Up) -->
  <path d="M 978 339 L 1050 339 L 1050 244 L 1115 244" class="conn-line" marker-end="url(#arrow)" />

  <!-- Backend to Mongo-Express (Branch Down) -->
  <path d="M 978 339 L 1050 339 L 1050 424 L 1115 424" class="conn-line" marker-end="url(#arrow)" />

  <!-- Mongo-Express to MongoDB -->
  <line x1="1144" y1="395" x2="1144" y2="280" class="conn-line" marker-end="url(#arrow)" />

  <!-- ========================================================================= -->
  <!-- CI/CD PIPELINE FLOW (BOTTOM ROW)                                          -->
  <!-- ========================================================================= -->

  <!-- CI/CD Boundary Box -->
  <g transform="translate(60, 580)">
    <rect width="660" height="120" rx="6" fill="#131d2e" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="4 3" />
    <text x="15" y="18" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="700">CI/CD Automation Pipeline (GitHub Actions)</text>

    <!-- Developer Actor (Small) -->
    <g transform="translate(30, 35)">
      <circle cx="15" cy="8" r="6" fill="none" stroke="#e2e8f0" stroke-width="1.5" />
      <line x1="15" y1="14" x2="15" y2="30" stroke="#e2e8f0" stroke-width="1.5" />
      <line x1="6" y1="20" x2="24" y2="20" stroke="#e2e8f0" stroke-width="1.5" />
      <line x1="15" y1="30" x2="8" y2="44" stroke="#e2e8f0" stroke-width="1.5" />
      <line x1="15" y1="30" x2="22" y2="44" stroke="#e2e8f0" stroke-width="1.5" />
      <text x="15" y="58" class="label-sub">Dev Push</text>
    </g>

    <!-- GitHub Repo Icon -->
    <g transform="translate(130, 42)">
      <circle cx="20" cy="20" r="18" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
      <path d="M 20 8 A 12 12 0 0 0 12 28 L 16 28 L 16 24 C 15 24 14 23 14 21 L 17 21 C 18 23 20 23 22 23 C 24 23 25 21 25 19 C 23 20 21 20 19 19 C 14 18 13 14 14 11 C 16 8 20 8 20 8 Z" fill="#ffffff" />
      <text x="20" y="52" class="label-sub">GitHub Repo</text>
    </g>

    <!-- CI Workflow -->
    <g transform="translate(260, 42)">
      <rect x="0" y="2" width="75" height="36" rx="4" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.2" />
      <text x="37" y="24" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">CI (Test)</text>
      <text x="37" y="52" class="label-sub">ci.yml</text>
    </g>

    <!-- CD Workflow -->
    <g transform="translate(410, 42)">
      <rect x="0" y="2" width="75" height="36" rx="4" fill="#065f46" stroke="#10b981" stroke-width="1.2" />
      <text x="37" y="24" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">CD (Deploy)</text>
      <text x="37" y="52" class="label-sub">cd.yml</text>
    </g>

    <!-- deploy.sh Runner -->
    <g transform="translate(555, 42)">
      <rect x="0" y="2" width="80" height="36" rx="4" fill="#042f2e" stroke="#14b8a6" stroke-width="1.2" />
      <text x="40" y="24" fill="#5eead4" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">deploy.sh</text>
      <text x="40" y="52" class="label-sub">Bash Runner</text>
    </g>

    <!-- Connecting Arrows in CI/CD -->
    <line x1="70" y1="62" x2="125" y2="62" class="conn-line" marker-end="url(#arrow)" />
    <line x1="170" y1="62" x2="255" y2="62" class="conn-line" marker-end="url(#arrow)" />
    <line x1="335" y1="62" x2="405" y2="62" class="conn-line" marker-end="url(#arrow)" />
    <line x1="485" y1="62" x2="550" y2="62" class="conn-line" marker-end="url(#arrow)" />
  </g>

  <!-- SSH Connection from deploy.sh to EC2 (Dashed Cyan Line) -->
  <path d="M 720 642 L 850 642 L 850 515" class="dashed-line" marker-end="url(#arrowSsh)" />
  <rect x="805" y="565" width="90" height="18" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
  <text x="850" y="578" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">SSH Port 22</text>

</svg>
